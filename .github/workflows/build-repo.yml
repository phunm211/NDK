name: Build NDK with repo (ndk-r30-beta1 + mirror clang)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build NDK via repo sync
    runs-on: ubuntu-latest

    steps:
      - name: Install repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y repo build-essential zip unzip flex bison texinfo pbzip2 mingw-w64

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize repo
        run: |
          repo init -u https://android.googlesource.com/platform/manifest -b ndk-r30-beta1 --partial-clone

      - name: Sync all projects
        run: |
          repo sync -j 4

      - name: Switch clang prebuilts to mirror-goog-main-llvm-toolchain-source
        run: |
          set -e
          for dir in prebuilts/clang/host/linux-x86 prebuilts/clang/host/windows-x86 platform/prebuilts/clang/host/darwin-x86; do
            if [ -d "$dir" ]; then
              echo "Switching $dir to mirror-goog-main-llvm-toolchain-source"
              cd "$dir"
              git fetch origin mirror-goog-main-llvm-toolchain-source || true
              git checkout mirror-goog-main-llvm-toolchain-source || echo "Branch not found in $dir"
              cd "$GITHUB_WORKSPACE"
            else
              echo "Directory $dir not found"
            fi
          done

      - name: Verify clang-r596125 exists
        run: |
          set -e
          for dir in prebuilts/clang/host/linux-x86 prebuilts/clang/host/windows-x86 platform/prebuilts/clang/host/darwin-x86; do
            if [ -d "$dir/clang-r596125" ]; then
              echo "FOUND: $dir/clang-r596125"
            else
              echo "MISSING: $dir/clang-r596125"
            fi
          done

      - name: Update CLANG_VERSION in toolchains.py
        run: |
          sed -i 's/^CLANG_VERSION = .*/CLANG_VERSION = "clang-r596125"/' ndk/toolchains.py
          grep '^CLANG_VERSION' ndk/toolchains.py

      - name: Install Poetry & Python Dependencies
        working-directory: ndk
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring poetry install

      - name: Run Python Unit Tests
        working-directory: ndk
        run: |
          poetry run pytest -m "not requires_ndk and not requires_network" --ignore=tests/pytest/ndkstack

      - name: Build NDK for Windows64
        working-directory: ndk
        run: |
          poetry run python3 checkbuild.py --system windows64 --no-build-tests

      - name: Upload NDK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-builds
          path: |
            out/dist/android-ndk-*.zip
            out/dist/android-ndk-*.tar.bz2