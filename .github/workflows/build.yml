name: Build Android NDK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Custom checkbuild.py arguments'
        required: false
        default: '--no-build-tests'

jobs:
  build:
    name: Build NDK (Linux & Windows)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NDK Repository
        uses: actions/checkout@v4
        with:
          path: 'ndk'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache AOSP Prebuilts
        uses: actions/cache@v4
        with:
          path: |
            prebuilts
            external
            toolchain
          key: aosp-prebuilts-v1-${{ runner.os }}-${{ hashFiles('ndk/scripts/fetch_prebuilts.py') }}
          restore-keys: |
            aosp-prebuilts-v1-${{ runner.os }}-

      - name: Install System & MinGW Cross-Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip flex bison texinfo pbzip2 mingw-w64

      - name: Install Poetry & Python Dependencies
        working-directory: ndk
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring poetry install

      - name: Fetch AOSP NDK Prebuilts
        working-directory: ndk
        run: |
          python3 scripts/fetch_prebuilts.py --host all --jobs 4

      - name: Run Python Unit Tests
        working-directory: ndk
        run: |
          poetry run pytest -m "not requires_ndk and not requires_network" --ignore=tests/pytest/ndkstack

      - name: Build NDK for Linux
        working-directory: ndk
        run: |
          python3 checkbuild.py --system linux-x86_64 ${{ github.event.inputs.build_args || '--no-build-tests' }}

      - name: Build NDK for Windows64
        working-directory: ndk
        run: |
          python3 checkbuild.py --system windows64 ${{ github.event.inputs.build_args || '--no-build-tests' }}

      - name: Upload NDK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-builds
          path: |
            out/dist/android-ndk-*.zip
            out/dist/android-ndk-*.tar.bz2

