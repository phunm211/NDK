name: Build Android NDK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Custom checkbuild.py arguments'
        required: false
        default: '--no-build-tests'

jobs:
  build:
    name: Build NDK (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NDK Repository
        uses: actions/checkout@v4
        with:
          path: 'ndk'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache AOSP Prebuilts
        uses: actions/cache@v4
        with:
          path: |
            prebuilts
            external
            toolchain
          key: aosp-prebuilts-v1-${{ runner.os }}-${{ hashFiles('ndk/scripts/fetch_prebuilts.py') }}
          restore-keys: |
            aosp-prebuilts-v1-${{ runner.os }}-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip flex bison texinfo pbzip2

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Python Dependencies
        working-directory: ndk
        run: |
          PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring poetry install

      - name: Fetch AOSP NDK Prebuilts (Parallel & Cached)
        working-directory: ndk
        run: |
          python3 scripts/fetch_prebuilts.py --host linux --jobs 4

      - name: Run Python Unit Tests
        working-directory: ndk
        run: |
          poetry run pytest -m "not requires_ndk and not requires_network"

      - name: Verify NDK Checkbuild CLI
        working-directory: ndk
        run: |
          poetry run python checkbuild.py --help
