name: Build Android NDK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Custom checkbuild.py arguments'
        required: false
        default: '--no-build-tests'

jobs:
  build:
    name: Build NDK (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NDK Repository
        uses: actions/checkout@v4
        with:
          path: 'ndk'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip flex bison texinfo pbzip2

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Python Dependencies
        working-directory: ndk
        run: |
          PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring poetry install

      - name: Run NDK Checkbuild Help Test
        working-directory: ndk
        run: |
          poetry run python checkbuild.py --help

      - name: Build NDK Readme & Core Components
        working-directory: ndk
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.build_args }}" ]; then
            poetry run python checkbuild.py ${{ github.event.inputs.build_args }}
          else
            poetry run python checkbuild.py --module readme --no-build-tests
          fi
